[package]
name = "Cardbe"
version = "1.0.1"
description = "A Tasks Manager"
authors = ["malecat"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cardbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
# Keep Tauri 2.11 internal runtime crates aligned.
# Prevent Cargo from resolving them to incompatible newer minor releases.
tauri-runtime = "~2.11.3"
tauri-runtime-wry = "~2.11.4"
tauri-macros = "~2.6.3"
tauri-utils = "~2.9.3"
tauri-plugin-opener = "~2.5.5"
tauri-plugin-dialog = "~2.7.3"
tauri-plugin-fs = "~2.5.2"
tauri-plugin-notification = "~2.4.0"
tauri-plugin-log = "2.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
local-ip-address = "0.6"
base64 = "0.22"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "io-util",
  "time",
  "macros",
] }
futures-util = "0.3"
tokio-tungstenite = "0.29"
iroh = "1.2"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
loro = "1.16"
log = "0.4.34"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "=2.2.0"
tauri-plugin-window-state = "2"
