[package]
name = "Cardbe"
version = "1.7.0"
description = "A Tasks Manager"
authors = ["malecat"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cardbe_lib"
# Desktop builds link the rlib into the binary. Add "staticlib" (iOS) and
# "cdylib" (Android) only when mobile targets are set up; building them for
# every desktop build produces multi-GB artifacts and a second full link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# Keep Tauri 2.12 internal runtime crates aligned.
# Prevent Cargo from resolving them to incompatible newer minor releases.
tauri-runtime = "~2.12.2"
tauri-runtime-wry = "~2.12.3"
tauri-macros = "~2.7.4"
tauri-utils = "~2.10.2"
tauri-plugin-opener = "~2.7.2"
tauri-plugin-dialog = "~2.8.3"
tauri-plugin-fs = "~2.7.1"
tauri-plugin-notification = "~2.7.0"
tauri-plugin-log = "~2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
local-ip-address = "0.6"
base64 = "0.22"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "io-util",
  "time",
  "macros",
] }
futures-util = "0.3"
tokio-tungstenite = "0.29"
iroh = "1.2"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
loro = "1.16"
log = "0.4.34"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
nucleo-matcher = "0.3.1"
scraper = "0.27.0"
wasmtime = { version = "49", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
  "std",
  "wat",
] }
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
] }
rmcp = { version = "3.7", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
schemars = "1"
subtle = "2"
tokio-util = "0.7"
tauri-plugin-deep-link = "2"

[profile.dev.package."*"]
# Skip dependency debug info to shrink PDBs and link time; Cardbe's own crate
# keeps full debug info for debugging.
debug = false

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "~2.5.4"
tauri-plugin-global-shortcut = "~2.4.1"
tauri-plugin-window-state = "~2.5.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Match the WebView2 bindings wry uses, to lower hidden windows' memory target.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

# Windows reads the app's process tree directly; other desktops use sysinfo.
[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
