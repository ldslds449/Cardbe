<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardbe</title>
    <style>
      #app-startup { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; color: #252525; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; transition: opacity 180ms ease-out, visibility 180ms ease-out; }
      #app-startup, #app-startup *, #app-startup *::before, #app-startup *::after { box-sizing: border-box; }
      #app-startup.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
      .startup-card { display: flex; width: 310px; height: 116px; max-width: calc(100vw - 48px); flex-direction: column; justify-content: space-between; padding: 24px; border: 1px solid #ebebeb; border-radius: 14px; background: #fff; box-shadow: 0 14px 40px rgb(0 0 0 / 5%); }
      .startup-brand { display: flex; height: 28px; align-items: center; gap: 10px; font-size: 19px; font-weight: 650; letter-spacing: -.04em; line-height: 28px; }
      .startup-icon { width: 28px; height: 28px; flex: 0 0 28px; }
      .startup-progress { position: relative; height: 4px; overflow: hidden; border-radius: 99px; background: #e9e9e9; } .startup-progress::after { position: absolute; top: 0; left: 0; width: 30%; height: 100%; border-radius: inherit; background: #252525; content: ""; animation: startup-progress 1.1s ease-in-out infinite alternate; }
      @keyframes startup-progress { to { left: 70%; } }
      @media (prefers-color-scheme: dark) { #app-startup { background: #252525; color: #fafafa; } .startup-card { border-color: #424242; background: #2b2b2b; box-shadow: none; } .startup-progress { background: #484848; } .startup-progress::after { background: #fafafa; } }
      @media (prefers-reduced-motion: reduce) { #app-startup { transition: none; } .startup-progress::after { animation: none; } }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="overflow: hidden;">
    <div id="app-startup" role="status" aria-live="polite" aria-label="Cardbe is loading">
      <div class="startup-card">
        <div class="startup-brand"><img class="startup-icon" src="%sveltekit.assets%/favicon.png" alt="" />Cardbe</div>
        <div class="startup-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
