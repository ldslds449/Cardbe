name: Set up toolchain
description: Install pnpm, Node.js, the pinned Rust toolchain, and project dependencies.

inputs:
  test-tools:
    description: Also install wasm-tools for plugin runtime tests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # package.json `devEngines.packageManager` is the single source of the pnpm version.
    - name: Read pnpm version
      id: pnpm
      shell: bash
      run: echo "version=$(node -p "require('./package.json').devEngines.packageManager.version")" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ steps.pnpm.outputs.version }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    # Installs the channel, components, and targets from rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
    - name: Install wasm-tools
      if: inputs.test-tools == 'true'
      shell: bash
      run: cargo install wasm-tools --version 1.259.0 --locked
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
