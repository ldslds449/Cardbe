name: Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to validate and build
        required: true
        type: string
      publish:
        description: Create or update the GitHub Release and upload artifacts
        required: false
        default: false
        type: boolean

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Validate tag format
        shell: pwsh
        run: |
          $prereleaseIdentifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $buildIdentifier = '[0-9A-Za-z-]+'
          $semver = "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$prereleaseIdentifier(\.$prereleaseIdentifier)*)?(\+$buildIdentifier(\.$buildIdentifier)*)?$"
          if (-not [regex]::IsMatch($env:RELEASE_TAG, $semver)) {
            Write-Error "Invalid release tag '$env:RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH with optional SemVer prerelease/build metadata."
            exit 1
          }

      - name: Verify tag is on main
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ -z "$tag_commit" ]]; then
            echo "Release tag '$RELEASE_TAG' does not exist in the checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit contained in main."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Validate release
        run: pnpm check
      - run: pnpm test
      - uses: taiki-e/install-action@git-cliff
      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          git-cliff --current --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delimiter = [guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "content<<$delimiter"
          Get-Content -Raw release-notes.md | Add-Content -Path $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter

      - name: Build release for manual run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        env:
          CARDBE_BUILD_COMMIT: ${{ steps.tag.outputs.commit }}
        run: pnpm tauri build

      - name: Verify portable executable for manual run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/target/release/Cardbe.exe')) {
            throw 'Tauri build did not produce the portable executable.'
          }

      - uses: tauri-apps/tauri-action@v1
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARDBE_BUILD_COMMIT: ${{ steps.tag.outputs.commit }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Cardbe ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.content }}
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Upload portable release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $binary = 'src-tauri/target/release/Cardbe.exe'
          if (-not (Test-Path $binary)) {
            throw 'Tauri build did not produce the portable executable.'
          }
          $asset = Join-Path $env:RUNNER_TEMP "Cardbe-$env:RELEASE_TAG-portable.exe"
          Copy-Item -LiteralPath $binary -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber
