name: Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to validate and build
        required: true
        type: string
      publish:
        description: Create or update the GitHub Release and upload artifacts
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag format
        shell: pwsh
        run: |
          $prereleaseIdentifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $buildIdentifier = '[0-9A-Za-z-]+'
          $semver = "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$prereleaseIdentifier(\.$prereleaseIdentifier)*)?(\+$buildIdentifier(\.$buildIdentifier)*)?$"
          if (-not [regex]::IsMatch($env:RELEASE_TAG, $semver)) {
            Write-Error "Invalid release tag '$env:RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH with optional SemVer prerelease/build metadata."
            exit 1
          }

      - name: Verify tag is on main
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [[ -z "$tag_commit" ]]; then
            echo "Release tag '$RELEASE_TAG' does not exist in the checkout."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit contained in main."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      # check/test already ran in CI for this commit on main; require that run
      # to have succeeded instead of repeating it. Waits while CI is running.
      - name: Verify CI passed for tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?head_sha=$COMMIT&event=push&branch=main"
          state_jq='.workflow_runs as $r
            | if any($r[]; .conclusion == "success") then "success"
              elif any($r[]; .status != "completed") then "pending"
              elif ($r | length) > 0 then "failed"
              else "missing" end'
          for attempt in $(seq 1 120); do
            state="$(gh api "$runs_url" --jq "$state_jq")"
            case "$state" in
              success) echo "CI passed for $COMMIT."; exit 0 ;;
              failed) echo "CI failed for $COMMIT. Fix it on main or re-run CI, then retry."; exit 1 ;;
              missing)
                # CI may not be queued yet right after pushing; give it a few minutes.
                if (( attempt > 10 )); then
                  echo "No CI run on main for $COMMIT. Tag a commit that CI ran on (the head of a push to main)."
                  exit 1
                fi ;;
            esac
            echo "Waiting for CI on $COMMIT ($state, attempt $attempt)..."
            sleep 30
          done
          echo "Timed out waiting for CI on $COMMIT."
          exit 1

      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@git-cliff
      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          git-cliff --current --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delimiter = [guid]::NewGuid().ToString()
          Add-Content -Path $env:GITHUB_OUTPUT -Value "content<<$delimiter"
          Get-Content -Raw release-notes.md | Add-Content -Path $env:GITHUB_OUTPUT
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter

      - name: Build release for manual run
        if: env.PUBLISH != 'true'
        env:
          CARDBE_BUILD_COMMIT: ${{ steps.tag.outputs.commit }}
        run: pnpm tauri build -- --locked

      - uses: tauri-apps/tauri-action@v1
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARDBE_BUILD_COMMIT: ${{ steps.tag.outputs.commit }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Cardbe ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.content }}
          releaseDraft: true
          args: -- --locked

      - name: Verify portable executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/target/release/Cardbe.exe')) {
            throw 'Tauri build did not produce the portable executable.'
          }

      - name: Upload build artifacts for manual run
        if: env.PUBLISH != 'true'
        uses: ./.github/actions/upload-build
        with:
          name: ${{ env.RELEASE_TAG }}
      - name: Upload release notes for manual run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Cardbe-${{ env.RELEASE_TAG }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP "Cardbe_$env:RELEASE_TAG-portable.exe"
          Copy-Item -LiteralPath 'src-tauri/target/release/Cardbe.exe' -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber
