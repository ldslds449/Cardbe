name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Push runs each get their own group so none
# is dropped: releases require a successful CI run for the tagged commit.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  check:
    # Same-repo PRs from branches already covered by `push` would run twice.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["develop", "main"]'), github.head_ref)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          test-tools: true
      - run: pnpm check
      - run: pnpm test
      - name: Build desktop app
        id: build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CARDBE_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm tauri build -- --locked
      - name: Upload build artifact
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/upload-build
        with:
          name: ${{ github.sha }}
          retention-days: ${{ github.ref == 'refs/heads/main' && 14 || 7 }}
